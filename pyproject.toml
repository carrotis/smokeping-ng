[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokeping-py"
version = "0.1.0"
description = "Modern Python SmokePing clone with an agent/server split, rich probe telemetry and Grafana-native storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "smokeping-py contributors" }]
keywords = ["smokeping", "latency", "monitoring", "icmp", "mtr", "clickhouse", "grafana"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = []
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
postgres = ["asyncpg>=0.29"]
# ClickHouse is spoken over its HTTP interface using httpx; no extra driver needed.
clickhouse = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
all = [
    "smokeping-py[server,postgres,clickhouse,dev]",
]

[project.scripts]
smoke-agent = "smokeagent.cli:main"
smoke-server = "smokeserver.cli:main"

[project.urls]
Homepage = "https://github.com/example/smokeping-py"

[tool.hatch.build.targets.wheel]
packages = ["src/smokecommon", "src/smokeagent", "src/smokeserver"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:smoke.*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "BLE", "S"]
ignore = [
    "B008",
    # `timeout` on our async helpers is a subprocess/socket deadline, not a
    # cancel scope; the rule's advice does not apply.
    "ASYNC109",
]

[tool.ruff.lint.isort]
known-first-party = ["smokecommon", "smokeagent", "smokeserver"]
# `conftest` is imported directly by the tests, not via a package.
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hardcoded fixtures, use `assert` by definition, and use
# class attributes as shared fixture data (RUF012).
"tests/**" = ["S101", "S105", "S106", "S311", "E501", "RUF012"]
# S608: the drivers interpolate only their own module constants (column names)
# and the configured database name into SQL. Every value that could come from
# the network goes through a placeholder or JSONEachRow body.
"src/smokeserver/storage/*.py" = ["S608"]

[tool.coverage.run]
source = ["src"]
