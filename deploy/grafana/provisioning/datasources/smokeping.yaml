apiVersion: 1

# Both datasources are provisioned with fixed UIDs, because the dashboard JSON
# references them by UID.  Only the one matching your storage driver will
# actually connect; the other simply sits unused.

datasources:
  - name: SmokePing-ClickHouse
    uid: smokeping-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: default
      defaultDatabase: smokeping
      # Panels almost always filter on a time range; letting Grafana push the
      # window into the WHERE clause is what keeps ClickHouse fast.
      dialTimeout: 10
      queryTimeout: 60
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: SmokePing-PostgreSQL
    uid: smokeping-postgres
    type: postgres
    access: proxy
    isDefault: false
    editable: true
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
